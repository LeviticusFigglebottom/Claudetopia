; Godot import settings for forge output (ARCHITECTURE.md §7, CONTRACTS.md §4).
;
; tools/forge/lib/export.py writes a <file>.import sidecar next to every generated GLB and
; PNG using the blocks below, so a clone imports with the right settings without opening the
; editor. Editing a value here changes what the next `./run.sh assets` writes; to re-stamp
; the existing assets without rebuilding them, run
;   godot --headless --path game --script res://tools_gd/apply_import_settings.gd
;
; Why these values:
;   meshes/generate_lods=true    the forge exports its own LOD1/LOD2 *meshes*, which the
;                                post-import script gives visibility ranges, and that is
;                                what anything instantiating the whole scene uses. The
;                                world streamer does not: it scatters an asset by handing
;                                one mesh to a MultiMesh, which has no visibility ranges
;                                and so drew LOD0 to the horizon -- seven million triangles
;                                in a Hearthvale vista against a budget of one and a half.
;                                Godot's per-surface mesh LODs are the only LOD a MultiMesh
;                                can use, so they are on; the two schemes do not fight,
;                                because they apply to different nodes.
;   import_script/path           glb_post_import.gd swaps *_foliage materials for the wind
;                                shader and wires up the LOD bands.
;   compress/mode=2              VRAM compressed; detect_3d is off because these textures
;                                are known to be 3D from the start.
;   compress/normal_map=1        set only on *_normal.png (export.py substitutes per file).
;   compress/channel_pack=1      ORM and normal maps are data, not colour.
;   roughness/mode=1             roughness lives in the ORM green channel.

[scene]
nodes/root_type=""
nodes/root_name=""
nodes/root_script=null
mesh_library/use_node_names_as_mesh_names=false
array_mesh/deduplicate_surfaces=true
nodes/apply_root_scale=true
nodes/root_scale=1.0
nodes/import_as_skeleton_bones=false
nodes/use_name_suffixes=true
nodes/use_node_type_suffixes=true
meshes/ensure_tangents=true
meshes/generate_lods=true
meshes/create_shadow_meshes=true
meshes/light_baking=1
meshes/lightmap_texel_size=0.2
meshes/force_disable_compression=false
skins/use_named_skins=true
animation/import=true
animation/fps=30
animation/trimming=false
animation/remove_immutable_tracks=true
animation/import_rest_as_RESET=false
import_script/path="res://tools_gd/glb_post_import.gd"
materials/extract=0
materials/extract_format=0
materials/extract_path=""
_subresources={}
gltf/naming_version=2
gltf/embedded_image_handling=1
gltf/texture_map_mode=1

[texture]
compress/mode=2
compress/high_quality=false
compress/lossy_quality=0.7
compress/uastc_level=0
compress/rdo_quality_loss=0.0
compress/hdr_compression=1
compress/normal_map={normal_map}
compress/channel_pack={channel_pack}
mipmaps/generate=true
mipmaps/limit=-1
roughness/mode=1
roughness/src_normal=""
process/channel_remap/red=0
process/channel_remap/green=1
process/channel_remap/blue=2
process/channel_remap/alpha=3
process/fix_alpha_border=true
process/premult_alpha=false
process/normal_map_invert_y=false
process/hdr_as_srgb=false
process/hdr_clamp_exposure=false
process/size_limit=0
detect_3d/compress_to=0
